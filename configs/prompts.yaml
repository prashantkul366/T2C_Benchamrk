# Prompt templates.
#
# Every system that consumes plain text gets its prompt from here, so a model is
# never penalised for a formatting convention it was never told about, and no
# model gets a hand-tuned prompt the others do not.
#
# `{prompt}` is substituted with the split's text. Nothing else is.

# --------------------------------------------------------------------------- #
# Native templates: reproduce each system's own training-time format verbatim.
# Changing these breaks comparability with the published numbers, so they are
# transcribed from the repos rather than written fresh.
# --------------------------------------------------------------------------- #

native:
  # CADmium was fine-tuned on
  #   [{"role": "system", "content": SYSTEM_MESSAGE},
  #    {"role": "user",   "content": <raw annotation>}]
  # (cadmium/src/tokenize_dataset.py). The system message below is byte-for-byte
  # their `cadmium.src.utils.prompts.SYSTEM_MESSAGE`, and the user turn is the
  # bare prompt with no added instruction text. Wrapping the prompt in our own
  # "You are a CAD assistant..." preamble -- which this file used to do -- puts
  # the model off its training distribution and costs it accuracy for reasons
  # that have nothing to do with its CAD ability.
  cadmium:
    system: |

      Generate CAD model JSON EXACTLY matching this schema:
       { "parts": { "part_1": { // Always use sequential part_1, part_2... even if some are null "coordinate_system": { "Euler Angles": [0.0, 0.0, 0.0], // XYZ rotation angles in degrees "Translation Vector": [0.0, 0.0, 0.0] // X,Y,Z position offsets }, "description": { "height": 0.0, // Total vertical dimension "length": 0.0, // Total horizontal dimension "name": "", // (optional) Component identifier "shape": "", // (optional) Basic geometric classification "width": 0.0 // Total depth dimension }, "extrusion": { "extrude_depth_opposite_normal": 0.0, // Negative direction extrusion "extrude_depth_towards_normal": 0.0, // Positive direction extrusion "operation": "NewBodyFeatureOperation", // One of: NewBodyFeatureOperation, JoinFeatureOperation, CutFeatureOperation, IntersectFeatureOperation "sketch_scale": 0.0 // Scaling factor for sketch geometry }, "sketch": { "face_1": { // Use sequential face_1, face_2... (null if unused) "loop_1": { // Use sequential loop_1, loop_2... (null if unused) "circle_1": { // Use sequential circle_1, circle_2... "Center": [0.0, 0.0], // X,Y coordinates "Radius": 0.0 }, "arc_1": { // Use sequential arc_1, arc_2... "Start Point": [0.0, 0.0], "End Point": [0.0, 0.0], "Mid Point": [0.0, 0.0] }, "line_1": { // Use sequential line_1, line_2... "Start Point": [0.0, 0.0], "End Point": [0.0, 0.0] } // ... (other geometric elements as null/none) } // ... (other loops as null/none) } // ... (other faces as null/none) } }, "part_2": null, // Maintain sequential numbering even for null parts // ... (additional parts) } } 

      STRICT RULES:
      - OUTPUT ONLY RAW JSON (no formatting/text/comments/explanations)
      - NEVER COPY INSTRUCTIONAL TEXT FROM JSON SCHEMA EXAMPLES
      - ALL numbers as floats (0.0 not 0)
      - ALLOWED OPERATIONS: NewBodyFeatureOperation/JoinFeatureOperation/CutFeatureOperation/IntersectFeatureOperation 
      - GEOMETRY REQUIREMENTS (these are the only available primitives):
        • Circles: Center[X,Y] + Radius
        • Arcs: Start[X,Y] + End[X,Y] + Mid[X,Y]
        • Lines: Start[X,Y] + End[X,Y]
      - ENFORCE part_1, part_2... sequence (include nulls)
      - NO NEW FIELDS
    user: "{prompt}"

  # CADFusion src/test/inference.py, verbatim.
  cadfusion: |
    Below is a description of a 3D shape:
    {prompt}
    Generate a Computer-Aided Design(CAD) command sequence of the 3D shape:

  # Text-to-CadQuery: trained AND evaluated on this exact scaffold, raw text with
  # no chat template (train/train_qwen-3B.py:24, inference/..._qwen-3B.py:35).
  # It is not a bare description -- omitting the markers loses the cue that tells
  # the model to start emitting code.
  text2cadquery: |
    ### Instruction:
    {prompt}

    ### Response:


  # cadrille builds its own chat template in cadrille.py; the runner defers to it.
  cadrille: "{prompt}"

# --------------------------------------------------------------------------- #
# General-LLM templates. Identical for every general model.
#
# Two variants are run. The 1-shot number is the headline (it measures CAD
# ability rather than format compliance); the 0-shot number quantifies how much
# of the gap was only ever about output formatting.
# --------------------------------------------------------------------------- #

general_zero_shot: |
  Write a CadQuery (Python) script that builds the 3D CAD model described below.

  Requirements:
  - Use only the `cadquery` library, imported as `cq`.
  - Assign the final solid to a variable named `r`.
  - Output a single Python code block and nothing else. No explanation.

  Description:
  {prompt}

general_one_shot: |
  Write a CadQuery (Python) script that builds the 3D CAD model described below.

  Requirements:
  - Use only the `cadquery` library, imported as `cq`.
  - Assign the final solid to a variable named `r`.
  - Output a single Python code block and nothing else. No explanation.

  Example
  -------
  Description: A rectangular plate 0.75 wide, 0.5 deep and 0.05 thick, with a
  through hole of radius 0.08 at its centre.

  ```python
  import cadquery as cq
  r = (
      cq.Workplane("XY")
      .box(0.75, 0.5, 0.05)
      .faces(">Z")
      .workplane()
      .hole(0.16)
  )
  ```

  Now do the same for this description.
  -------
  Description:
  {prompt}

# --------------------------------------------------------------------------- #
# Generation settings. Fixed across every system: same budget, same policy.
# --------------------------------------------------------------------------- #

generation:
  pass_at_1:
    do_sample: false
    temperature: 0.0
    num_return_sequences: 1
  best_of_k:
    do_sample: true
    temperature: 0.7
    top_p: 0.95
    num_return_sequences: 5
    seed: 0

  # Per-system token budgets. These are architectural or trained limits, not
  # tuning knobs: raising them past the trained limit produces garbage, lowering
  # them truncates. They are the one setting that legitimately differs.
  max_new_tokens:
    default: 1024
    cadrille: 768        # its trained generation length
    cadfusion: 512       # src/test/utils.py MAX_LENGTH
    text2cad: 272        # MAX_CAD_SEQUENCE_LENGTH, architectural
